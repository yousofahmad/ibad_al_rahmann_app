# Place Java heap ABOVE the 4 GB boundary so native memory can grow freely
# in the 0-4 GB range without crashing (CompressedOops conflict fix).
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=384m -XX:HeapBaseMinAddress=0x100000000 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.daemon=false
android.useAndroidX=true
kotlin.incremental=false
android.enableBuildCache=false
org.gradle.caching=false
org.gradle.java.home=D:/Android studio/jbr
